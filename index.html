<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RF Studio BgRemove</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b; --sf: #18181b; --el: #232329; --in: #121215;
  --bd: #2e2e36; --ac: #06b6d4; --ac-light: #22d3ee; --ac-dark: #0284c7;
  --tx: #f4f4f5; --mu: #a1a1aa; --dg: #ef4444;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif; overflow: hidden; display: flex; flex-direction: column; }

/* CABEÇALHO */
header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--sf); border-bottom: 1px solid var(--bd); flex-shrink: 0; }
header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
header h1 span { color: var(--ac-light); }
.logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--ac), var(--ac-dark)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; }
.logo-icon svg { width: 16px; height: 16px; stroke-width: 2.5; }

/* PALCO (ÁREA CENTRAL) */
#stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background-color: var(--bg); background-image: radial-gradient(#232329 1px, transparent 1px); background-size: 18px 18px; overflow: hidden; position: relative; }

/* ÁREA DE UPLOAD */
#dropzone { border: 2px dashed var(--bd); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; background: var(--in); width: 100%; max-width: 500px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#dropzone:hover, #dropzone.drag-active { border-color: var(--ac-light); background: rgba(6,182,212,0.08); }
.up-icon { color: var(--ac-light); }
#dropzone h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--tx); }
#dropzone p { margin: 0; font-size: 12px; color: var(--mu); }

/* VISUALIZAÇÃO DA IMAGEM */
.img-preview { max-width: 100%; max-height: 55vh; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); object-fit: contain; background: repeating-conic-gradient(#232329 0% 25%, transparent 0% 50%) 50% / 20px 20px; }

/* GAVETA INFERIOR (PAINEL) */
#panel { background: var(--sf); border-top: 1px solid var(--bd); border-radius: 16px 16px 0 0; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); z-index: 10; overflow-y: auto; max-height: 50vh; }

/* COMPONENTES DE UI */
.c { background: var(--in); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.l { font-size: 11px; font-weight: 600; color: var(--mu); display: flex; justify-content: space-between; align-items: center; }

.chk-row { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.chk-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ac); margin: 0; flex-shrink: 0; cursor: pointer; }
.chk-title { font-size: 13px; font-weight: 500; color: var(--tx); }

.b { background: var(--el); border: 1px solid var(--bd); color: var(--tx); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; }
.b:hover, .b:active { background: var(--ac-soft); border-color: var(--ac-light); color: var(--ac-light); }

.p { background: linear-gradient(135deg, var(--ac), var(--ac-dark)); color: #fff; border: 0; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(6,182,212,0.3); transition: transform 0.1s; }
.p:active { transform: scale(0.98); }

.seg { display: flex; gap: 4px; background: var(--in); border: 1px solid var(--bd); padding: 4px; border-radius: 8px; width: 100%; }
.seg button { flex: 1; background: transparent; border: 0; color: var(--mu); padding: 8px 4px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.15s; white-space: nowrap; }
.seg button.on { background: var(--el); color: var(--ac-light); box-shadow: 0 0 0 1px rgba(6,182,212,0.3); }

input[type=color] { width: 100%; height: 34px; border: 1px solid var(--bd); border-radius: 8px; background: var(--el); padding: 2px; cursor: pointer; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* SWATCHES */
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sw-btn { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--bd); cursor: pointer; transition: transform 0.12s; }
.sw-btn:hover { border-color: var(--ac-light); transform: scale(1.1); }

/* UTILITÁRIOS */
.hidden { display: none !important; }
.loader-spinner { width: 36px; height: 36px; border: 3px solid var(--bd); border-bottom-color: var(--ac-light); border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; margin-bottom: 12px; }
@keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#progressBar { width: 100%; max-width: 300px; height: 6px; background: var(--el); border-radius: 4px; overflow: hidden; margin: 12px auto 0; border: 1px solid var(--bd); }
#progressFill { height: 100%; background: var(--ac-light); width: 0%; transition: width 0.15s ease; }

@media (min-width: 900px) {
  body { flex-direction: row; }
  header { position: absolute; top: 0; left: 0; width: 100%; z-index: 20; background: transparent; border: 0; }
  #stage { padding-top: 60px; }
  #panel { width: 400px; height: 100%; border-top: 0; border-left: 1px solid var(--bd); border-radius: 0; padding: 24px; max-height: none; }
}
</style>
</head>
<body>

<!-- MÓDULO DA INTELIGÊNCIA ARTIFICIAL -->
<script type="module">
  import imglyRemoveBackground from "https://esm.sh/@imgly/background-removal@1.4.3";
  window.imglyRemoveBackground = imglyRemoveBackground;
</script>

<header>
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </div>
  <h1>RF Studio <span>BgRemove</span></h1>
</header>

<div id="stage">
  <!-- TELA 1: UPLOAD -->
  <div id="view-upload" style="width:100%; display:flex; justify-content:center;">
    <div id="dropzone">
      <svg class="up-icon" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div>
        <h3>Carregar Imagem</h3>
        <p>Clique ou arraste uma foto (JPG, PNG, WebP)</p>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </div>

  <!-- TELA 2: CARREGAMENTO -->
  <div id="view-loading" class="hidden" style="text-align:center;">
    <span class="loader-spinner"></span>
    <div style="font-weight:600; color:var(--tx); font-size:14px" id="progressTitle">Iniciando IA...</div>
    <div style="font-size:12px; color:var(--mu); margin-top:4px" id="progressDesc">Aguarde um momento</div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <!-- TELA 3: RESULTADO -->
  <div id="view-result" class="hidden" style="width:100%; text-align:center; display:flex; flex-direction:column; align-items:center;">
    <div class="seg" id="resultTabs" style="width: auto; margin-bottom: 12px;">
      <button data-tab="result" class="on">Resultado</button>
      <button data-tab="original">Original</button>
    </div>
    <img id="resultImage" class="img-preview" src="">
    <img id="originalImage" class="img-preview hidden" src="">
  </div>
</div>

<!-- GAVETA LATERAL / INFERIOR DE CONTROLES -->
<div id="panel">
  
  <div id="editorControls" class="hidden" style="display:flex; flex-direction:column; gap:12px;">
    
    <!-- CONTROLES DE FUNDO -->
    <div class="c">
      <div class="l">Fundo da Imagem</div>
      <div class="seg" id="bgTypeSeg">
        <button data-v="transp" class="on">Transparente</button>
        <button data-v="solid">Cor Sólida</button>
        <button data-v="grad">Degradê</button>
      </div>
      
      <div id="bgControlsBox" class="hidden">
        <div class="g2">
          <div>
            <div class="l" style="margin-bottom:4px">Cor 1</div>
            <input type="color" id="bgColor1" value="#06b6d4">
          </div>
          <div id="bgCol2Wrapper" class="hidden">
            <div class="l" style="margin-bottom:4px">Cor 2</div>
            <input type="color" id="bgColor2" value="#0284c7">
          </div>
        </div>
        <div class="l" style="margin-top:8px">Cores Rápidas</div>
        <div class="swatches" id="bgSwatches">
          <!-- Gerado via JS -->
        </div>
      </div>
    </div>

    <!-- CONTROLES DE EFEITO -->
    <div class="c">
      <label class="chk-row">
        <input type="checkbox" id="fadeCheckbox" checked>
        <span class="chk-title">Efeito esfumaçado na base (Fade)</span>
      </label>
      <div id="fadeControlsBox">
        <div class="g2" style="margin-top: 4px;">
          <div>
            <div class="l" style="margin-bottom:6px">Altura <span id="fadeHeightVal">30%</span></div>
            <input type="range" id="fadeHeight" min="10" max="100" value="30" style="width: 100%; accent-color: var(--ac);">
          </div>
          <div>
            <div class="l" style="margin-bottom:6px">Intensidade <span id="fadeIntensityVal">100%</span></div>
            <input type="range" id="fadeIntensity" min="10" max="100" value="100" style="width: 100%; accent-color: var(--ac);">
          </div>
        </div>
      </div>
    </div>

    <!-- NOVO: CONTROLES DE NITIDEZ -->
    <div class="c">
      <div class="l">Nitidez (Realce de Detalhes)</div>
      <div class="seg" id="sharpnessSeg">
        <button data-v="0" class="on">Desligado</button>
        <button data-v="0.15">Leve</button>
        <button data-v="0.35">Forte</button>
      </div>
    </div>

    <!-- CONTROLES DE UPSCALING E EXPORTAÇÃO -->
    <div class="c">
      <div class="l">Qualidade de Exportação (Upscale)</div>
      <div class="seg" id="upscaleSeg">
        <button data-v="1" class="on">1x (Padrão)</button>
        <button data-v="2">2x (HD)</button>
        <button data-v="3">3x (Ultra)</button>
      </div>
      
      <button class="p" id="downloadBtn" style="width:100%; margin-top:4px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Baixar Imagem
      </button>
      <button class="b" id="newImgBtn" style="width:100%;">
        Remover outro fundo
      </button>
    </div>

  </div>

  <div id="initialPlaceholder" style="text-align:center; padding: 20px; color: var(--mu); font-size: 13px;">
    Carregue uma imagem para ver as opções de edição.
  </div>

</div>

<!-- LÓGICA DO APLICATIVO -->
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const viewUpload = document.getElementById('view-upload');
const viewLoading = document.getElementById('view-loading');
const viewResult = document.getElementById('view-result');
const resultImage = document.getElementById('resultImage');
const originalImage = document.getElementById('originalImage');
const progressFill = document.getElementById('progressFill');
const progressTitle = document.getElementById('progressTitle');
const progressDesc = document.getElementById('progressDesc');
const resultTabs = document.getElementById('resultTabs');

const editorControls = document.getElementById('editorControls');
const initialPlaceholder = document.getElementById('initialPlaceholder');
const fadeCheckbox = document.getElementById('fadeCheckbox');
const fadeControlsBox = document.getElementById('fadeControlsBox');
const fadeHeight = document.getElementById('fadeHeight');
const fadeIntensity = document.getElementById('fadeIntensity');
const fadeHeightVal = document.getElementById('fadeHeightVal');
const fadeIntensityVal = document.getElementById('fadeIntensityVal');
const downloadBtn = document.getElementById('downloadBtn');
const newImgBtn = document.getElementById('newImgBtn');
const sharpnessSeg = document.getElementById('sharpnessSeg');

// Controles de Fundo
const bgTypeSeg = document.getElementById('bgTypeSeg');
const bgControlsBox = document.getElementById('bgControlsBox');
const bgColor1 = document.getElementById('bgColor1');
const bgColor2 = document.getElementById('bgColor2');
const bgCol2Wrapper = document.getElementById('bgCol2Wrapper');
const bgSwatches = document.getElementById('bgSwatches');
const upscaleSeg = document.getElementById('upscaleSeg');

const PRESET_COLORS = ['#ffffff', '#000000', '#0f172a', '#083344', '#052e16', '#3b0764', '#7f1d1d', '#06b6d4', '#fbbf24'];

let originalObjectURL = null;
let currentObjectURL = null;
let rawCutoutImage = new Image(); // Guarda o recorte puro feito pela IA
let finalDataUrl = null;

// Configurações atuais
let config = {
  bgType: 'transp', // transp, solid, grad
  bgC1: '#06b6d4',
  bgC2: '#0284c7',
  fade: true,
  fadeHeight: 30,
  fadeIntensity: 100,
  upscale: 1,
  sharpness: 0
};

// Renderizar Swatches
bgSwatches.innerHTML = PRESET_COLORS.map(c => `<button type="button" class="sw-btn" data-c="${c}" style="background:${c}"></button>`).join('');
bgSwatches.addEventListener('click', (e) => {
  const btn = e.target.closest('.sw-btn');
  if (btn) {
    bgColor1.value = btn.dataset.c;
    config.bgC1 = btn.dataset.c;
    renderCanvas();
  }
});

// Atualizar Configurações via UI
function setupSegControl(el, key, callback) {
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    el.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    config[key] = btn.dataset.v === 'true' ? true : btn.dataset.v === 'false' ? false : (isNaN(btn.dataset.v) ? btn.dataset.v : parseFloat(btn.dataset.v));
    if (callback) callback();
    renderCanvas();
  });
}

setupSegControl(bgTypeSeg, 'bgType', () => {
  if (config.bgType === 'transp') {
    bgControlsBox.classList.add('hidden');
  } else {
    bgControlsBox.classList.remove('hidden');
    if (config.bgType === 'grad') bgCol2Wrapper.classList.remove('hidden');
    else bgCol2Wrapper.classList.add('hidden');
  }
});

setupSegControl(upscaleSeg, 'upscale');
setupSegControl(sharpnessSeg, 'sharpness');

fadeCheckbox.addEventListener('change', (e) => {
  config.fade = e.target.checked;
  if (config.fade) {
    fadeControlsBox.classList.remove('hidden');
  } else {
    fadeControlsBox.classList.add('hidden');
  }
  renderCanvas();
});

fadeHeight.addEventListener('input', (e) => {
  config.fadeHeight = e.target.value;
  fadeHeightVal.innerText = config.fadeHeight + '%';
  renderCanvas();
});

fadeIntensity.addEventListener('input', (e) => {
  config.fadeIntensity = e.target.value;
  fadeIntensityVal.innerText = config.fadeIntensity + '%';
  renderCanvas();
});

bgColor1.addEventListener('input', (e) => { config.bgC1 = e.target.value; renderCanvas(); });
bgColor2.addEventListener('input', (e) => { config.bgC2 = e.target.value; renderCanvas(); });


// Configuração da IA
const aiConfig = {
  publicPath: "https://unpkg.com/@imgly/background-removal-data@1.4.3/dist/",
  progress: (key, current, total) => {
    const percent = Math.round((current / total) * 100);
    progressFill.style.width = percent + '%';
    progressTitle.innerText = `Baixando Motor de IA (${percent}%)`;
    progressDesc.innerText = "Isso acontece apenas na primeira vez.";
  }
};

// Gerenciador de Telas
function switchView(view) {
  viewUpload.classList.add('hidden');
  viewLoading.classList.add('hidden');
  viewResult.classList.add('hidden');
  editorControls.classList.add('hidden');
  initialPlaceholder.classList.remove('hidden');

  if (view === 'upload') viewUpload.classList.remove('hidden');
  else if (view === 'loading') viewLoading.classList.remove('hidden');
  else if (view === 'result') {
    viewResult.classList.remove('hidden');
    editorControls.classList.remove('hidden');
    initialPlaceholder.classList.add('hidden');
  }
}

// Algoritmo Matemático de Nitidez (Unsharp Mask via Convolução)
function applySharpen(ctx, w, h, amount) {
  if (amount <= 0) return;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const copy = new Uint8ClampedArray(data);
  const w4 = w * 4;
  
  // Matriz de Convolução 3x3
  const a = amount;
  const center = 1 + 4 * a;
  const edge = -a;

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      // Pula pixels muito transparentes para não criar halos escuros nas bordas do recorte
      if (data[i + 3] < 10) continue; 

      for (let c = 0; c < 3; c++) {
        const val =
          copy[i - w4 + c] * edge + // Top
          copy[i - 4 + c] * edge +  // Left
          copy[i + c] * center +    // Center
          copy[i + 4 + c] * edge +  // Right
          copy[i + w4 + c] * edge;  // Bottom
        data[i + c] = val;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// MOTOR DE RENDERIZAÇÃO INSTANTÂNEO (Fundo + IA + Fade + Upscale)
function renderCanvas() {
  if (!rawCutoutImage.src) return;

  const canvas = document.createElement('canvas');
  // Aplica o Upscaling na criação do Canvas
  canvas.width = rawCutoutImage.width * config.upscale;
  canvas.height = rawCutoutImage.height * config.upscale;
  const ctx = canvas.getContext('2d');
  
  // Melhora a qualidade do redimensionamento (Upscaling Nativo)
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // 1. Desenhar Fundo
  if (config.bgType === 'solid') {
    ctx.fillStyle = config.bgC1;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (config.bgType === 'grad') {
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, config.bgC1);
    grad.addColorStop(1, config.bgC2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. Desenhar Recorte da IA
  ctx.drawImage(rawCutoutImage, 0, 0, canvas.width, canvas.height);

  // NOVO: Aplicar Algoritmo de Nitidez
  if (config.sharpness > 0) {
    applySharpen(ctx, canvas.width, canvas.height, config.sharpness);
  }

  // 3. Aplicar Fade (Esfumaçado)
  if (config.fade) {
    ctx.globalCompositeOperation = 'destination-in';
    const fadeTop = canvas.height * (1 - (config.fadeHeight / 100));
    const gradient = ctx.createLinearGradient(0, canvas.height, 0, fadeTop);
    
    const bottomAlpha = 1 - (config.fadeIntensity / 100);
    
    gradient.addColorStop(0, `rgba(0,0,0,${bottomAlpha})`);
    gradient.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over'; // Reseta
  }

  // Atualizar a imagem na tela e gerar o arquivo de download
  finalDataUrl = canvas.toDataURL('image/png', 1.0);
  resultImage.src = finalDataUrl;
}

// Processamento Inicial da IA
async function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    alert("Por favor, envie um arquivo de imagem válido (JPG, PNG).");
    return;
  }

  switchView('loading');
  progressFill.style.width = '0%';
  progressTitle.innerText = 'Verificando Inteligência Artificial...';
  progressDesc.innerText = 'Aguarde um momento.';

  if (originalObjectURL) URL.revokeObjectURL(originalObjectURL);

  originalObjectURL = URL.createObjectURL(file);
  originalImage.src = originalObjectURL;

  if (typeof window.imglyRemoveBackground === 'undefined') {
    alert("A IA ainda está conectando aos servidores. Aguarde 2 segundos e selecione a foto novamente!");
    switchView('upload');
    return;
  }

  try {
    progressTitle.innerText = 'Processando...';
    progressDesc.innerText = 'Separando o fundo da imagem principal.';
    progressFill.style.width = '100%';

    // Roda a IA UMA ÚNICA VEZ
    const imageBlob = await window.imglyRemoveBackground(file, aiConfig);
    
    // Salva o recorte puro na memória
    rawCutoutImage.onload = () => {
      renderCanvas(); // Renderiza com as configurações atuais
      switchView('result');
      activateTab('result');
    };
    rawCutoutImage.src = URL.createObjectURL(imageBlob);

  } catch (error) {
    console.error("Erro na IA:", error);
    alert("Não foi possível remover o fundo. Verifique sua conexão ou tente outra imagem.");
    switchView('upload');
  }
}

// Eventos de Drag & Drop
dropzone.addEventListener('click', (e) => {
  if (e.target !== fileInput) fileInput.click();
});
dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('drag-active');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-active'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-active');
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    handleFile(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files.length > 0) {
    handleFile(e.target.files[0]);
  }
});

// Abas Result/Original
function activateTab(tabName) {
  const btns = resultTabs.querySelectorAll('button');
  btns.forEach(b => b.classList.remove('on'));
  resultTabs.querySelector(`[data-tab="${tabName}"]`).classList.add('on');
  
  if (tabName === 'result') {
    resultImage.classList.remove('hidden');
    originalImage.classList.add('hidden');
  } else {
    resultImage.classList.add('hidden');
    originalImage.classList.remove('hidden');
  }
}

resultTabs.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) activateTab(btn.dataset.tab);
});

// Botões Finais
downloadBtn.addEventListener('click', () => {
  if (!finalDataUrl) return;
  const a = document.createElement('a');
  a.href = finalDataUrl;
  a.download = `RF-BgRemove-${config.upscale}x-${Date.now()}.png`;
  a.click();
});

newImgBtn.addEventListener('click', () => {
  fileInput.value = '';
  switchView('upload');
});
</script>
</body>
</html>
